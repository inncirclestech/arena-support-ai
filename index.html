<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Support AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
  :root {
    /* Palette matched to the live Arena product: navy #112d57 ink + amber #fab133 accent
       (sampled from the product's own Create Project button and nav). */
    --base: #f4f6f9;
    --surface: #ffffff;
    --surface-raised: #ffffff;
    --ink: #112d57;
    --ink-soft: #33475f;
    --muted: #636363;
    --border: #dde3ea;
    --border-soft: #eaeef2;
    --accent: #fab133;
    --accent-hover: #e89e1f;
    --accent-ink: #112d57;
    --accent-tint: #fdecd0;
    --accent-tint-soft: #fef6e8;
    --ok: #2f7d4f;
    --ok-tint: #e0f2e6;
    --code-bg: #eef1f5;
    --shadow-sm: 0 1px 2px rgba(17, 45, 87, 0.06);
    --shadow-md: 0 2px 4px rgba(17, 45, 87, 0.05), 0 10px 24px -12px rgba(17, 45, 87, 0.18);
    --shadow-lg: 0 4px 10px rgba(17, 45, 87, 0.06), 0 24px 48px -20px rgba(17, 45, 87, 0.22);
    --radius-sm: 7px;
    --radius-md: 11px;
    --radius-lg: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--base);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }
  ::selection { background: var(--accent-tint); }

  .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }

  /* ---------- Rail (secondary) ---------- */
  .rail {
    border-right: 1px solid var(--border);
    background: linear-gradient(180deg, #ffffff 0%, var(--base) 100%);
    padding: 22px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: scroll;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: var(--muted) transparent;
  }
  .rail::-webkit-scrollbar { width: 8px; }
  .rail::-webkit-scrollbar-track { background: transparent; }
  .rail::-webkit-scrollbar-thumb { background-color: color-mix(in srgb, var(--muted) 55%, transparent); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  .rail::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
  .brand { display: flex; align-items: center; }
  .brand-logo { width: 100%; max-width: 190px; height: auto; display: block; }
  .brand-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .rail-nav-btn {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 10px; border-radius: var(--radius-sm);
    border: 1px solid transparent; background: transparent; cursor: pointer;
    text-align: left; font-family: inherit; font-size: 13px; color: var(--ink-soft);
    transition: background 0.12s ease;
  }
  .rail-nav-btn:hover { background: var(--surface); }
  .rail-nav-btn.active {
    background: var(--surface); border-color: var(--border); color: var(--ink);
    font-weight: 600; box-shadow: var(--shadow-sm);
  }
  .rail-nav-btn.primary {
    background: linear-gradient(155deg, var(--accent) 0%, #e0932a 100%);
    color: var(--accent-ink); font-weight: 600; box-shadow: var(--shadow-sm);
    margin-bottom: 4px;
  }
  .rail-nav-btn.primary:hover { box-shadow: var(--shadow-md); }
  .module-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .rail-section-label {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted); margin: 6px 4px 2px;
  }
  .rail-category-label {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
    margin: 14px 4px 4px; padding-top: 10px; border-top: 1px solid var(--border-soft);
  }
  .rail-category-label:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .global-search-box { position: relative; margin: 2px 0 4px; }
  .global-search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .global-search-box input {
    width: 100%; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md);
    padding: 10px 12px 10px 30px; font-family: inherit; font-size: 13px; color: var(--ink); outline: none;
    box-shadow: var(--shadow-sm);
  }
  .global-search-box input:focus { border-color: var(--accent); }

  .module-search-box { position: relative; margin: 2px 0 6px; }
  .module-search-box svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .module-search-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 7px 10px 7px 28px; font-family: inherit; font-size: 12.5px; color: var(--ink); outline: none;
  }
  .module-search-box input:focus { border-color: var(--accent); }
  .module-nav { display: flex; flex-direction: column; gap: 2px; }
  .module-nav-empty { font-size: 12px; color: var(--muted); padding: 8px 4px; }
  .rail-footer {
    margin-top: auto; font-size: 10.5px; color: var(--muted);
    border-top: 1px solid var(--border-soft); padding-top: 10px; line-height: 1.5;
  }

  /* ---------- Main ---------- */
  .main { display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }

  /* ---------- Chat (primary) ---------- */
  .chat-shell {
    flex: 1; display: flex; flex-direction: column;
    max-width: 760px; width: 100%; margin: 0 auto;
    padding: 36px 32px 24px;
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .chat-hero { text-align: center; margin-bottom: 22px; }
  .chat-hero-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
    background: var(--accent-tint-soft); padding: 5px 13px; border-radius: 999px;
    margin-bottom: 14px;
  }
  .chat-hero-badge .status-dot { animation: pulse-dot 1.8s infinite ease-in-out; }
  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.55;transform:scale(.8)} }
  @media (prefers-reduced-motion: reduce) { .chat-hero-badge .status-dot { animation: none; } }
  .chat-hero h1 {
    font-family: "Fraunces", serif; font-weight: 600; font-size: 30px;
    margin: 0 0 8px; letter-spacing: -0.015em; text-wrap: balance;
  }
  .chat-hero p { color: var(--muted); font-size: 14px; margin: 0; max-width: 480px; margin: 0 auto; }

  .chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 2px 16px; }
  .chat-msg { display: flex; gap: 10px; max-width: 100%; animation: msg-in 0.22s ease both; }
  @keyframes msg-in { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  @media (prefers-reduced-motion: reduce) { .chat-msg { animation: none; } }
  .chat-msg.user { flex-direction: row-reverse; }
  .chat-avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 700;
  }
  .chat-avatar.assistant { background: linear-gradient(155deg, var(--accent) 0%, #e0932a 100%); color: var(--accent-ink); box-shadow: var(--shadow-sm); }
  .chat-avatar.user { background: var(--code-bg); color: var(--ink-soft); }
  .chat-bubble {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 12px 16px; font-size: 14.5px; color: var(--ink-soft); max-width: 84%;
    box-shadow: var(--shadow-sm);
  }
  .chat-msg.user .chat-bubble {
    background: linear-gradient(155deg, var(--accent) 0%, #e0932a 100%);
    color: var(--accent-ink); border-color: transparent;
  }
  .chat-bubble p { margin: 0 0 8px; } .chat-bubble p:last-child { margin-bottom: 0; }
  .chat-bubble ol, .chat-bubble ul { margin: 6px 0; padding-left: 20px; }
  .chat-bubble li { margin-bottom: 5px; }
  .chat-bubble strong { font-weight: 600; }
  .chat-bubble code { background: var(--code-bg); color: var(--ink); font-family: "IBM Plex Mono", monospace; font-size: 0.9em; padding: 1px 5px; border-radius: 4px; }
  .chat-msg.user .chat-bubble code { background: rgba(255,255,255,0.22); color: inherit; }

  .chat-source-tag {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 10px;
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.04em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px; font-weight: 600;
  }
  .chat-followups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .chat-followups-label { font-size: 11px; color: var(--muted); width: 100%; }
  .chat-followup-btn {
    font-size: 12px; color: var(--ink-soft); background: var(--base);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px;
    cursor: pointer; font-family: inherit;
  }
  .chat-followup-btn:hover { border-color: var(--accent); color: var(--accent); }

  .chat-clarify { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .chat-clarify-btn {
    text-align: left; font-size: 13px; color: var(--ink); background: var(--base);
    border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px;
    cursor: pointer; font-family: inherit; font-weight: 500;
  }
  .chat-clarify-btn:hover { border-color: var(--accent); background: var(--accent-tint-soft); }

  .chat-history-bar { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .clear-history-btn {
    font-size: 11.5px; color: var(--muted); background: none; border: none;
    cursor: pointer; font-family: inherit; padding: 4px 6px; text-decoration: underline;
  }
  .clear-history-btn:hover { color: var(--accent); }

  .chat-suggest-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 4px 0 20px; }
  .chat-suggest {
    font-size: 12.5px; color: var(--ink-soft); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px;
    cursor: pointer; font-family: inherit; box-shadow: var(--shadow-sm);
  }
  .chat-suggest:hover { border-color: var(--accent); color: var(--accent); }

  .chat-input-bar {
    display: flex; gap: 8px; border-top: 1px solid var(--border);
    padding-top: 14px; margin-top: auto;
  }
  .chat-input-bar input {
    flex: 1; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius-md); padding: 13px 16px; font-family: inherit;
    font-size: 14.5px; color: var(--ink); outline: none;
  }
  .chat-input-bar input:focus { border-color: var(--accent); }
  .mic-btn {
    width: 46px; height: 46px; flex-shrink: 0;
    border: 1.5px solid var(--border); background: var(--surface); border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    color: var(--ink-soft); transition: all 0.12s ease;
  }
  .mic-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mic-btn.listening {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    animation: mic-pulse 1.2s infinite ease-in-out;
  }
  @keyframes mic-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(181,80,42,0.4)} 50%{box-shadow:0 0 0 8px rgba(181,80,42,0)} }
  @media (prefers-reduced-motion: reduce) { .mic-btn.listening { animation: none; } }
  .mic-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .chat-input-bar button.send-btn {
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: var(--radius-md); padding: 0 20px; font-family: inherit;
    font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;
    box-shadow: var(--shadow-sm); transition: background 0.12s ease, box-shadow 0.12s ease;
  }
  .send-btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
  .send-btn:hover:not(:disabled) { background: var(--accent-hover); box-shadow: var(--shadow-md); }

  .chat-status-note {
    font-size: 11px; color: var(--muted); margin-top: 8px; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 14px;
  }

  /* ---------- AI mode toggle ---------- */
  .ai-mode-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 0 0 16px; font-size: 12px; color: var(--muted);
  }
  .ai-mode-toggle {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); transition: border-color 0.15s ease, background 0.15s ease;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600;
    letter-spacing: 0.02em; user-select: none;
  }
  .ai-mode-toggle:hover { border-color: var(--accent); }
  .ai-mode-toggle.on { background: var(--accent-tint-soft); border-color: var(--accent); color: var(--accent-ink); }
  .ai-mode-toggle .switch {
    width: 26px; height: 15px; border-radius: 999px; background: var(--border);
    position: relative; transition: background 0.15s ease; flex-shrink: 0;
  }
  .ai-mode-toggle.on .switch { background: var(--accent); }
  .ai-mode-toggle .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px;
    border-radius: 50%; background: #fff; transition: transform 0.15s ease;
  }
  .ai-mode-toggle.on .switch::after { transform: translateX(11px); }
  .ai-mode-toggle .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0;
  }
  .ai-mode-toggle.loading .dot { background: var(--accent); animation: pulse-dot 1.2s infinite ease-in-out; }
  .ai-mode-toggle.ready .dot { background: var(--ok); }
  .chat-source-tag.ai-tag { background: var(--accent-tint); color: var(--accent-ink); }

  /* ---------- Welcome / instructions panel (first-time, no history yet) ---------- */
  .chat-welcome {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 16px 20px; margin: 0 0 16px; box-shadow: var(--shadow-sm);
  }
  .chat-welcome-lead { margin: 0 0 10px; font-size: 13.5px; color: var(--ink); font-weight: 600; }
  .chat-welcome-list { margin: 0 0 10px; padding-left: 20px; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .chat-welcome-list li { margin-bottom: 4px; }
  .chat-welcome-list em { font-style: italic; color: var(--ink); }
  .chat-welcome-note { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
  .chat-welcome-note a { color: var(--accent-hover); }
  .chat-welcome-first-visit {
    margin: 0; font-size: 12px; color: var(--muted); padding-top: 8px;
    border-top: 1px dashed var(--border-soft);
  }

  /* ---------- AI readiness gate: blocks chatting until ready/opted-in ---------- */
  .ai-gate {
    background: var(--accent-tint-soft); border: 1px solid var(--accent-tint);
    border-radius: var(--radius-md); padding: 14px 18px; margin: 0 0 16px;
  }
  .ai-gate[hidden] { display: none; }
  .ai-gate-progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ai-gate-progress-track {
    flex: 1; height: 8px; border-radius: 999px; background: var(--border-soft);
    overflow: hidden;
  }
  .ai-gate-progress-fill {
    height: 100%; width: 0%; background: var(--accent); border-radius: 999px;
    transition: width 0.2s ease;
  }
  .ai-gate-progress-pct {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600;
    color: var(--ink-soft); min-width: 34px; text-align: right; flex-shrink: 0;
  }
  .ai-gate-text { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
  .ai-gate-fallback { margin: 0 0 10px; font-size: 13px; color: var(--ink-soft); line-height: 1.55; }
  .ai-gate-continue-btn {
    background: var(--surface); color: var(--ink); border: 1.5px solid var(--accent);
    border-radius: var(--radius-sm); padding: 9px 16px; font-family: inherit;
    font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.12s ease;
  }
  .ai-gate-continue-btn:hover { background: var(--accent-tint); }

  .chat-suggest-hidden { display: none !important; }

  /* ---------- Browse view (secondary) ---------- */
  .browse-shell { width: 100%; margin: 0; padding: 32px 40px 80px; max-width: none; }
  .doc-header { margin-bottom: 18px; }
  .doc-module-overview {
    font-size: 15px; color: var(--ink-soft); line-height: 1.65; max-width: 80ch;
    padding-bottom: 22px; border-bottom: 1px solid var(--border-soft); margin-bottom: 4px;
  }
  .doc-module-overview p { margin: 0 0 10px; }
  .doc-module-overview strong { color: var(--ink); }

  /* Common tasks card */
  .doc-tasks-card {
    margin: 18px 0 28px; padding: 16px 20px; background: var(--surface-raised);
    border: 1px solid var(--border); border-radius: var(--radius-md);
  }
  .doc-tasks-label {
    display: flex; align-items: center; gap: 7px;
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px;
  }
  .doc-tasks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .doc-task-link {
    display: flex; align-items: center; gap: 9px; text-align: left; width: 100%;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; font-family: inherit; font-size: 13px; color: var(--ink); font-weight: 500;
    cursor: pointer; transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .doc-task-link:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
  .doc-task-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .doc-task-link svg { flex-shrink: 0; color: var(--accent); }

  /* Two-column layout: main content + sticky TOC rail at wide widths */
  .doc-layout { display: block; }
  .doc-toc-and-search {
    display: flex; flex-direction: column; gap: 14px;
    margin: 22px 0 28px; padding: 16px 18px; background: var(--surface-raised);
    border: 1px solid var(--border); border-radius: var(--radius-md);
  }
  .doc-search-box { position: relative; width: 100%; max-width: 480px; }
  .doc-search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .doc-search-box input {
    width: 100%; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px 10px 32px; font-family: inherit; font-size: 13.5px; color: var(--ink); outline: none;
  }
  .doc-search-box input:focus { border-color: var(--accent); }
  .doc-toc-label {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0;
  }
  .doc-toc { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .doc-toc-link {
    font-size: 12px; color: var(--ink-soft); text-decoration: none; background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  }
  .doc-toc-link:hover { border-color: var(--accent); color: var(--accent); }
  .doc-toc-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .doc-toc-link-dim { opacity: 0.35; }

  /* Sticky rail TOC shown only at wide viewports (built alongside the flex fallback above) */
  .doc-toc-rail { display: none; }

  @media (min-width: 1100px) {
    .doc-layout { display: grid; grid-template-columns: 1fr 240px; align-items: start; gap: 40px; }
    .doc-toc-and-search { display: block; }
    .doc-toc-and-search .doc-toc-label, .doc-toc-and-search .doc-toc { display: none; }
    .doc-toc-rail {
      display: block; position: sticky; top: 24px; max-height: calc(100vh - 48px);
      overflow-y: auto; padding-left: 2px;
    }
    .doc-toc-rail .doc-toc-label {
      font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px;
    }
    .doc-toc-rail-list { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
    .doc-toc-rail-link {
      display: flex; align-items: baseline; gap: 8px; text-decoration: none;
      font-size: 12.5px; color: var(--muted); padding: 6px 10px; border-radius: var(--radius-sm);
      border-left: 2px solid transparent; line-height: 1.4;
    }
    .doc-toc-rail-num { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; flex-shrink: 0; }
    .doc-toc-rail-link:hover { color: var(--ink); background: var(--surface-raised); }
    .doc-toc-rail-link.active { color: var(--accent-ink); font-weight: 600; border-left-color: var(--accent); background: var(--accent-tint-soft); }
    .doc-toc-rail-link.doc-toc-link-dim { opacity: 0.35; }
  }

  .doc-section {
    scroll-margin-top: 16px;
    margin-bottom: 36px;
    padding: 24px 26px 26px;
    background: var(--surface-raised);
    border: 1px solid var(--border-soft);
    border-top: 3px solid var(--accent);

<script>
  // ---------- In-browser LLM (WebLLM) — the primary way questions get answered ----------
  // Auto-loads on page load (see aiLoadPromise below), not behind a toggle: this is what
  // lets the chatbot actually read and understand a question instead of falling back to
  // showing a "which did you mean?" button menu whenever offline keyword-matching is
  // unsure. First visit downloads a large (~600MB-1GB) model, cached by the browser
  // afterward via Cache Storage, so later visits start instantly. Requires WebGPU
  // (Chrome/Edge 113+, not available in Safari/Firefox stable yet, and not available at
  // all inside a sandboxed iframe like a claude.ai artifact preview) — unsupported
  // browsers transparently fall back to the offline engine's own answer/clarify/none
  // behavior. All synthesis is strictly grounded in KB entries retrieved by the existing
  // offline engine (retrieveTopEntries) — the model is never given an open-ended prompt,
  // so it cannot answer from outside the documentation.
  window.ArenaLLM = (function () {
    const MODEL_ID = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
    let engine = null;
    let loading = false;
    let ready = false;
    let failReason = null;

    function isSupported() {
      return !!navigator.gpu && window.self === window.top;
    }

    async function load(onProgress) {
      if (ready) return true;
      if (loading) return false;
      if (!isSupported()) {
        failReason = (window.self !== window.top)
          ? "WebGPU is blocked inside this embedded preview — open the page directly to enable AI mode."
          : "This browser doesn't support WebGPU yet — try a recent Chrome or Edge.";
        return false;
      }
      loading = true;
      try {
        const webllm = await import("https://esm.run/@mlc-ai/web-llm");
        engine = await webllm.CreateMLCEngine(MODEL_ID, {
          initProgressCallback: (p) => { if (onProgress) onProgress(p); }
        });
        ready = true;
        return true;
      } catch (e) {
        failReason = "Couldn't load the AI model (" + (e && e.message ? e.message : "unknown error") + ").";
        return false;
      } finally {
        loading = false;
      }
    }

    // contextEntries: array of {question, answer} pulled from the offline engine's KB.
    // Returns synthesized answer text, or null if generation fails for any reason
    // (caller should fall back to the plain offline-engine answer).
    //
    // The retrieved notes are deliberately NOT shown to the model as labeled
    // "Q: ... A: ..." pairs — a small model tends to mimic whatever structure
    // it's shown, and a numbered question/answer format primes it to echo
    // that same numbered list back verbatim instead of writing prose. Plain
    // unlabeled reference notes plus an explicit instruction and a short
    // worked example steer it toward an actual conversational answer.
    async function answer(userQuestion, contextEntries) {
      if (!ready || !engine) return null;
      const notes = contextEntries.map(e => `- ${e.answer.replace(/<\/?strong>/g, "**")}`).join("\n");
      const system = `You are Arena Support AI, a documentation assistant for the Inncircles Arena construction management product. A user asks a question in plain English; you answer it directly and conversationally, like a knowledgeable colleague, using ONLY the facts in the reference notes below — never invent steps, screen names, or fields that aren't in them.

Reference notes (internal — do not quote, number, or label these; use them only as source material for your own sentences):
${notes}

Rules:
- Answer using ONLY the single note that best matches the user's specific question. The other notes are decoys included for context — most of them are NOT what the user asked about, so ignore them completely. Do not combine or summarize multiple notes together.
- Write 2-4 short sentences of plain prose, in your own words. Never output a list, never output "Q:"/"A:" labels, never repeat a note word-for-word.
- If NONE of the notes actually answer the question, respond with exactly: "I don't have documented steps for that yet — try emailing support@inncircles.com." Do not guess, and do not describe an unrelated note just because it's the closest thing available.

Example of the style to use — if a note says "Go to Settings, click Add User, fill the form, click Save" and the user asks "how do I add someone", a good answer is: "You can add a new user from Settings — click Add User, fill in their details, and hit Save." Write like that: natural, direct, one topic, no labels.`;
      try {
        const res = await engine.chat.completions.create({
          messages: [
            { role: "system", content: system },
            { role: "user", content: userQuestion }
          ],
          temperature: 0.2,
          max_tokens: 200
        });
        let text = res && res.choices && res.choices[0] && res.choices[0].message && res.choices[0].message.content;
        if (!text) return null;
        text = text.trim();
        // Defensive cleanup: if the model still slipped into the Q:/A: or
        // numbered-list pattern despite the instructions, treat it as a
        // failed generation rather than show the user a garbled echo — the
        // caller falls back to the plain offline-engine answer instead.
        if (/^\s*\[?\d+\]?\s*Q:/im.test(text) || /^\s*Q:\s/im.test(text)) return null;
        return text;
      } catch (e) {
        return null;
      }
    }

    return { load, answer, isSupported, isReady: () => ready, isLoading: () => loading, failReason: () => failReason };
  })();
</script>
<script>
  const KB = buildKB(MODULES);
  const railNav = document.getElementById("module-nav");
  const main = document.getElementById("main");
  const navChatBtn = document.getElementById("nav-chat");
  const moduleSearchInput = document.getElementById("module-search");
  const globalSearchInput = document.getElementById("global-search");

  let state = { view: "chat", moduleId: null };
  let moduleFilter = "";
  let recognizer = null;
  let listening = false;
  let lastMatchedContext = null; // {moduleId, object} from the last confidently-answered turn

  // ---------- Auto-load the in-browser AI model on page load ----------
  // AI answering is the primary experience now, not an opt-in toggle: the
  // offline engine (matchQuery/retrieveTopEntries) still does all retrieval,
  // but WebLLM is what actually reads the question and answers it, so a
  // question phrased in a way the keyword matcher wouldn't recognize (a typo,
  // an unusual word choice, a compound term) still gets a real, direct
  // answer instead of a "which did you mean?" button menu. If the browser
  // can't run WebGPU (or this page is embedded in a sandboxed iframe that
  // blocks it), aiLoadPromise resolves to false and every question quietly
  // falls back to the offline engine's own answer/clarify/none behavior —
  // so the app is always fully usable, just less fluent, without WebLLM.
  let aiStatusListeners = [];
  function notifyAiStatus() { aiStatusListeners.forEach(fn => fn()); }
  // Latest WebLLM progress report ({progress: 0-1, text}) — kept so any newly
  // rendered gate/status UI can paint the current percentage immediately
  // instead of waiting for the next progress tick.
  let aiLoadProgress = { progress: 0, text: "" };
  const aiLoadPromise = ArenaLLM.isSupported()
    ? ArenaLLM.load((p) => {
        if (p) aiLoadProgress = { progress: typeof p.progress === "number" ? p.progress : aiLoadProgress.progress, text: p.text || aiLoadProgress.text };
        notifyAiStatus();
      }).finally(notifyAiStatus)
    : Promise.resolve(false);

  // ---------- Chat gate: no chatting until the AI is ready (or the visitor ----------
  // explicitly opts into the basic keyword-matching fallback). Once unlocked for
  // a given browser (basic mode chosen, or the model becomes ready), it stays
  // unlocked for the rest of the session/browser via localStorage.
  const BASIC_MODE_KEY = "arena-support-ai-basic-mode-v1";
  function getBasicModeChosen() {
    try { return localStorage.getItem(BASIC_MODE_KEY) === "1"; } catch (e) { return false; }
  }
  function setBasicModeChosen() {
    try { localStorage.setItem(BASIC_MODE_KEY, "1"); } catch (e) { /* storage unavailable */ }
  }
  let chatUnlocked = false;

  // ---------- Local per-browser chat history (no login, no server) ----------
  const HISTORY_KEY = "arena-support-ai-history-v1";
  function loadHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(chatHistory)); } catch (e) { /* storage unavailable — history just won't persist */ }
  }
  let chatHistory = loadHistory();

  const SUGGESTED_QUESTIONS = [
    "How do I create a new user?",
    "How do I assign a user to a project?",
    "How do I raise a Load Out Request?",
    "How do I create a new opportunity?",
    "How do I add a new vendor?",
    "How do I raise a support ticket?"
  ];

  function moduleColor(id) {
    const m = MODULES.find(m => m.id === id);
    return m ? m.color : "#b5502a";
  }
  function tint(id) { return `color-mix(in srgb, ${moduleColor(id)} 16%, var(--surface))`; }
  function fg(id) { return moduleColor(id); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- Answer text -> HTML (plain markdown-lite, matches the extraction format) ----------
  function renderAnswerHtml(text) {
    let html = escapeHtml(text);
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/(?:^|\n)((?:\d+\.\s+.+(?:\n|$))+)/g, block => {
      const items = block.trim().split(/\n/).map(l => l.replace(/^\d+\.\s+/, "")).map(l => `<li>${l}</li>`).join("");
      return `\n<ol>${items}</ol>\n`;
    });
    html = html.replace(/(?:^|\n)((?:[-*]\s+.+(?:\n|$))+)/g, block => {
      const items = block.trim().split(/\n/).map(l => l.replace(/^[-*]\s+/, "")).map(l => `<li>${l}</li>`).join("");
      return `\n<ul>${items}</ul>\n`;
    });
    html = html.split(/\n{2,}/).map(chunk => {
      if (/^\s*<(ol|ul)>/.test(chunk)) return chunk;
      return `<p>${chunk.replace(/\n/g, "<br>")}</p>`;
    }).join("");
    return html;
  }

  const NOT_FOUND_MESSAGE = `I don't have documented steps for that yet.

**Contact Arena support:** email **support@inncircles.com**, or in the product click the **Support** icon (headset icon, top-right of the navigation bar) to raise a ticket directly — describe what you were trying to do and a team member will follow up.`;

  // ---------- Conversational framing for offline-engine answers ----------
  // The stored KB `answer` text is accurate but terse/instructional by design
  // (it's shared with the browse/search views too). For chat, wrap it with a
  // natural lead-in and a brief closing offer so it reads like a person
  // answering rather than a raw excerpt — without adding or changing any of
  // the underlying facts, steps, or names. Purely presentational; the answer
  // text itself is untouched, so this never risks introducing inaccuracies.
  const ANSWER_OPENERS = [
    "Good question — here's how that works.",
    "Sure, here's how to do that.",
    "Here's how that's handled in Arena.",
    "That one comes up a lot — here's the rundown.",
    "Happy to walk you through that."
  ];
  const ANSWER_CLOSERS = [
    "Let me know if any of those steps don't match what you're seeing, and I can dig further.",
    "If something looks different on your screen, tell me what you're seeing and I'll help narrow it down.",
    "Ask if you'd like more detail on any part of that.",
    "Let me know if you'd like the related screens or a deeper walkthrough of any step."
  ];
  let answerVariantCounter = 0;
  function conversationalize(answerText) {
    const i = answerVariantCounter++;
    const opener = ANSWER_OPENERS[i % ANSWER_OPENERS.length];
    const closer = ANSWER_CLOSERS[i % ANSWER_CLOSERS.length];
    return `${opener}\n\n${answerText}\n\n${closer}`;
  }

  // ---------- Rail ----------
  const CATEGORY_ORDER = ["home", "projects", "admin"];
  const CATEGORY_LABELS = { home: "Home", projects: "Projects", admin: "Admin Setup" };
  // Explicit within-category ordering where the default MODULES array order
  // doesn't match the desired sidebar sequence (lower = earlier).
  const MODULE_SORT_ORDER = {
    "account-basics": 0,      // Getting Started
    "global-data": 1,
    "admin-setup-guide": 2,
    "notifications": 3,
    "permissions": 4,
    // Project modules mirror the product's own left sidebar order.
    "my-desk": 0,
    "my-calendar": 1,
    "project-setup": 2,
    "field-works": 3,
    "data-analytics": 4,
    "document-repository": 5,
    "follow-up-actions": 6,
    "project-notifications": 7,
    "users-and-permissions": 8,
    "owners": 9,
    "project-settings": 10
  };
  function moduleSortKey(m) {
    return MODULE_SORT_ORDER.hasOwnProperty(m.id) ? MODULE_SORT_ORDER[m.id] : 999;
  }

  function renderRail() {
    const q = moduleFilter.trim().toLowerCase();
    const visible = q ? MODULES.filter(m => m.name.toLowerCase().includes(q) || (m.alias||"").toLowerCase().includes(q)) : MODULES;

    if (!visible.length) {
      railNav.innerHTML = `<div class="module-nav-empty">No modules match "${escapeHtml(moduleFilter)}"</div>`;
    } else {
      railNav.innerHTML = CATEGORY_ORDER.map(cat => {
        const mods = visible.filter(m => m.category === cat).sort((a, b) => moduleSortKey(a) - moduleSortKey(b));
        if (!mods.length) return "";
        return `
          <div class="rail-category-label">${CATEGORY_LABELS[cat]}</div>
          ${mods.map(m => `
            <button class="rail-nav-btn ${state.view==='browse' && state.moduleId===m.id ? 'active' : ''}" data-module="${m.id}">
              <span class="module-dot" style="background:${m.color}"></span>
              <span>${m.name}</span>
            </button>
          `).join("")}
        `;
      }).join("");
    }
    navChatBtn.classList.toggle("active", state.view === "chat");

    railNav.querySelectorAll(".rail-nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state = { view: "browse", moduleId: btn.dataset.module };
        renderRail();
        renderBrowse(state.moduleId);
      });
    });
  }
  navChatBtn.addEventListener("click", () => {
    state = { view: "chat", moduleId: null };
    renderRail();
    renderChat();
  });
  moduleSearchInput.addEventListener("input", e => {
    moduleFilter = e.target.value;
    renderRail();
  });

  let globalSearchDebounce = null;
  globalSearchInput.addEventListener("input", e => {
    const v = e.target.value;
    clearTimeout(globalSearchDebounce);
    globalSearchDebounce = setTimeout(() => {
      if (!v.trim()) { state = { view: "chat", moduleId: null }; renderRail(); renderChat(); return; }
      state = { view: "search", moduleId: null };
      renderRail();
      renderSearchResults(v);
    }, 150);
  });
  globalSearchInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      clearTimeout(globalSearchDebounce);
      const v = e.target.value;
      if (!v.trim()) return;
      state = { view: "search", moduleId: null };
      renderRail();
      renderSearchResults(v);
    }
  });

  // ---------- Browse view: full narrative docs when available, Q&A-only fallback otherwise ----------
  function groupQaBySection(items) {
    const groups = {}; const order = [];
    items.forEach(it => {
      const key = it.section || "General";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(it);
    });
    return { groups, order };
  }

  const ICON_STEPS = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`;
  const ICON_TERMS = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`;
  const ICON_QA = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
  const ICON_TASK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>`;
  const ICON_CHEVRON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>`;

  function renderDefinitionsHtml(defs, collapseId) {
    if (!defs || !defs.length) return "";
    const shouldCollapse = defs.length > 3;
    const rows = `<dl class="doc-definitions"${shouldCollapse ? ` id="${collapseId}" hidden` : ""}>${defs.map(d => `
      <div class="doc-def-row">
        <dt>${escapeHtml(d.term)}</dt>
        <dd>${renderAnswerHtml(d.definition)}</dd>
      </div>
    `).join("")}</dl>`;
    if (!shouldCollapse) return rows;
    return `<button type="button" class="doc-terms-toggle" aria-expanded="false" aria-controls="${collapseId}">${ICON_CHEVRON} Show ${defs.length} terms</button>${rows}`;
  }

  function renderProceduresHtml(procs) {
    if (!procs || !procs.length) return "";
    return procs.map(p => `
      <div class="doc-procedure">
        <h4 class="doc-procedure-title">${escapeHtml(p.title)}</h4>
        <ol class="doc-procedure-steps">${(p.steps || []).map(s => `<li><span class="doc-step-text">${s}</span></li>`).join("")}</ol>
        ${p.note ? `<div class="doc-callout">${renderAnswerHtml(p.note)}</div>` : ""}
      </div>
    `).join("");
  }

  function renderQaListHtml(items, idPrefix) {
    if (!items || !items.length) return "";
    return `<div class="browse-qa-list">${items.map((it, i) => {
      const bodyId = `${idPrefix}-qa-${i}`;
      return `
      <div class="browse-qa-item">
        <button type="button" class="browse-qa-trigger" aria-expanded="false" aria-controls="${bodyId}">${escapeHtml(it.question)}<span class="browse-scope-pill">${it.scope}</span></button>
        <div class="browse-qa-body" id="${bodyId}" hidden>${renderAnswerHtml(it.answer)}</div>
      </div>
    `;
    }).join("")}</div>`;
  }

  function matchesModuleFilter(text, filter) {
    if (!filter) return true;
    return (text || "").toLowerCase().includes(filter.toLowerCase());
  }

  let tocScrollObserver = null;

  function renderBrowse(moduleId, opts) {
    const mod = MODULES.find(m => m.id === moduleId);
    const items = mod.qaItems || [];
    const { groups, order } = groupQaBySection(items);
    const hasNarrative = Array.isArray(mod.narrative) && mod.narrative.length > 0;
    const filter = (opts && opts.filter) || "";

    // Build section list: prefer narrative order, but fold in any qaItem sections
    // that narrative writing hasn't covered yet, so nothing is ever hidden.
    let sectionHeadings = hasNarrative ? mod.narrative.map(s => s.heading) : order.slice();
    order.forEach(h => { if (!sectionHeadings.includes(h)) sectionHeadings.push(h); });

    function sectionMatchesFilter(heading) {
      if (!filter) return true;
      if (matchesModuleFilter(heading, filter)) return true;
      const narr = hasNarrative ? mod.narrative.find(s => s.heading === heading) : null;
      if (narr) {
        if (matchesModuleFilter(narr.intro, filter)) return true;
        if ((narr.definitions || []).some(d => matchesModuleFilter(d.term, filter) || matchesModuleFilter(d.definition, filter))) return true;
        if ((narr.procedures || []).some(p => matchesModuleFilter(p.title, filter) || (p.steps||[]).some(s=>matchesModuleFilter(s, filter)))) return true;
      }
      const qa = groups[heading] || [];
      return qa.some(it => matchesModuleFilter(it.question, filter) || matchesModuleFilter(it.answer, filter));
    }

    const visibleHeadings = sectionHeadings.filter(sectionMatchesFilter);

    // "Common tasks" card: aggregate up to 6 procedure titles from every section, jump to their section anchor.
    const allTasks = [];
    if (hasNarrative) {
      mod.narrative.forEach(sec => {
        (sec.procedures || []).forEach(p => {
          allTasks.push({ title: p.title, heading: sec.heading });
        });
      });
    }
    const commonTasks = allTasks.slice(0, 6);

    main.innerHTML = `
      <div class="browse-shell">
        <div class="doc-header">
          <span class="doc-eyebrow" style="background:${tint(mod.id)};color:${fg(mod.id)}">${mod.alias || mod.name}</span>
          <h1 class="doc-title">${mod.name}</h1>
          <p class="doc-tagline">${mod.tagline || ""}</p>
        </div>

        ${mod.overview ? `<div class="doc-module-overview">${mod.overview}</div>` : ""}

        ${commonTasks.length ? `
        <div class="doc-tasks-card">
          <p class="doc-tasks-label">Common tasks</p>
          <div class="doc-tasks-grid">${commonTasks.map(t => `
            <button type="button" class="doc-task-link" data-jump="sec-${slugify(t.heading)}">${ICON_TASK}<span>${escapeHtml(t.title)}</span></button>
          `).join("")}</div>
        </div>` : ""}

        <div class="doc-toc-and-search">
          <div class="doc-search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="doc-search-input" type="text" placeholder="Search within ${escapeHtml(mod.name)}…" value="${escapeHtml(filter)}" autocomplete="off">
          </div>
          ${sectionHeadings.length > 1 ? `
          <div>
            <p class="doc-toc-label">On this page</p>
            <nav class="doc-toc">${sectionHeadings.map(h => `<a href="#sec-${slugify(h)}" class="doc-toc-link ${visibleHeadings.includes(h) ? '' : 'doc-toc-link-dim'}">${escapeHtml(h)}</a>`).join("")}</nav>
          </div>` : ""}
        </div>

        <div class="doc-layout">
          <div class="doc-main-col">
            ${visibleHeadings.length ? visibleHeadings.map((heading, idx) => {
              const narr = hasNarrative ? mod.narrative.find(s => s.heading === heading) : null;
              const qaItems = groups[heading] || [];
              const stepCount = narr && narr.procedures ? narr.procedures.length : 0;
              const termCount = narr && narr.definitions ? narr.definitions.length : 0;
              const qaCount = qaItems.length;
              const metaParts = [];
              if (stepCount) metaParts.push(`${stepCount} step${stepCount===1?'':'s'}`);
              if (termCount) metaParts.push(`${termCount} term${termCount===1?'':'s'}`);
              if (qaCount) metaParts.push(`${qaCount} question${qaCount===1?'':'s'}`);
              const slug = slugify(heading);
              return `
              <section class="doc-section" id="sec-${slug}" data-toc-heading="${escapeHtml(heading)}">
                <div class="doc-section-head">
                  <span class="doc-section-badge">${idx + 1}</span>
                  <div class="doc-section-heading-wrap">
                    <h2 class="browse-group-heading">${escapeHtml(heading)}</h2>
                    ${metaParts.length ? `<p class="doc-section-meta">${metaParts.join(" · ")}</p>` : ""}
                  </div>
                </div>
                ${narr && narr.intro ? renderIntroHtml(narr.intro) : ""}

                ${stepCount ? `
                <div class="doc-subblock">
                  <h3 class="doc-subheading">${ICON_STEPS} Steps</h3>
                  ${renderProceduresHtml(narr.procedures)}
                </div>` : ""}

                ${termCount ? `
                <div class="doc-subblock">
                  <h3 class="doc-subheading">${ICON_TERMS} Terms to know</h3>
                  ${renderDefinitionsHtml(narr.definitions, `terms-${slug}`)}
                </div>` : ""}

                ${qaCount ? `
                <div class="doc-subblock">
                  <h3 class="doc-subheading">${ICON_QA} Questions</h3>
                  ${renderQaListHtml(qaItems, slug)}
                </div>` : ""}
              </section>
            `;
            }).join("") : `<p style="color:var(--muted)">No sections match "${escapeHtml(filter)}".</p>`}
          </div>

          ${visibleHeadings.length > 1 ? `
          <aside class="doc-toc-rail" aria-label="On this page">
            <p class="doc-toc-label">On this page</p>
            <ul class="doc-toc-rail-list">${visibleHeadings.map((h, i) => `
              <li><a href="#sec-${slugify(h)}" class="doc-toc-rail-link" data-rail-target="sec-${slugify(h)}"><span class="doc-toc-rail-num">${i + 1}</span><span>${escapeHtml(h)}</span></a></li>
            `).join("")}</ul>
          </aside>` : ""}
        </div>
      </div>
    `;

    const docSearchInput = document.getElementById("doc-search-input");
    if (docSearchInput) {
      docSearchInput.addEventListener("input", e => {
        renderBrowse(moduleId, { filter: e.target.value });
      });
      if (filter) { docSearchInput.focus(); docSearchInput.setSelectionRange(filter.length, filter.length); }
    }

    // Common-task jump links
    main.querySelectorAll(".doc-task-link").forEach(btn => {
      btn.addEventListener("click", () => {
        const target = document.getElementById(btn.dataset.jump);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    // Terms-to-know collapse toggles
    main.querySelectorAll(".doc-terms-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const list = document.getElementById(btn.getAttribute("aria-controls"));
        const expanded = btn.getAttribute("aria-expanded") === "true";
        btn.setAttribute("aria-expanded", String(!expanded));
        if (list) list.hidden = expanded;
        const count = list ? list.querySelectorAll(".doc-def-row").length : 0;
        btn.lastChild.textContent = ` ${expanded ? "Show" : "Hide"} ${count} terms`;
      });
    });

    // Q&A accordion toggles
    main.querySelectorAll(".browse-qa-trigger").forEach(btn => {
      btn.addEventListener("click", () => {
        const body = document.getElementById(btn.getAttribute("aria-controls"));
        const expanded = btn.getAttribute("aria-expanded") === "true";
        btn.setAttribute("aria-expanded", String(!expanded));
        btn.closest(".browse-qa-item").classList.toggle("open", !expanded);
        if (body) body.hidden = expanded;
      });
    });

    // Sticky TOC rail: highlight current section on scroll (IntersectionObserver)
    if (tocScrollObserver) { tocScrollObserver.disconnect(); tocScrollObserver = null; }
    const railLinks = main.querySelectorAll(".doc-toc-rail-link");
    const sections = main.querySelectorAll(".doc-section[id]");
    if (railLinks.length && sections.length) {
      const setActive = id => {
        railLinks.forEach(l => l.classList.toggle("active", l.dataset.railTarget === id));
      };
      tocScrollObserver = new IntersectionObserver(entries => {
        const visible = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (visible.length) setActive(visible[0].target.id);
      }, { root: main, rootMargin: "-10% 0px -70% 0px", threshold: [0, 1] });
      sections.forEach(sec => tocScrollObserver.observe(sec));
      setActive(sections[0].id);
    }

    // Smooth-scroll for TOC rail + inline TOC links (native anchor jump still works without JS)
    main.querySelectorAll(".doc-toc-rail-link, .doc-toc-link").forEach(link => {
      link.addEventListener("click", e => {
        const id = link.getAttribute("href").slice(1);
        const target = document.getElementById(id);
        if (target) { e.preventDefault(); target.scrollIntoView({ behavior: "smooth", block: "start" }); }
      });
    });
  }

  // Show only the first paragraph of a section intro so the Steps come into
  // view quickly; the rest sits behind a native "Read more" disclosure.
  function renderIntroHtml(intro) {
    const paras = String(intro).match(/<p>[\s\S]*?<\/p>/g);
    if (!paras || paras.length < 2) return `<div class="doc-intro">${intro}</div>`;
    return `<div class="doc-intro">${paras[0]}<details class="doc-intro-more"><summary>Read more</summary>${paras.slice(1).join("")}</details></div>`;
  }

  function slugify(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  // ---------- Global search (across every module's narrative + Q&A) ----------
  // Built lazily and cached — MODULES doesn't change at runtime.
  let GLOBAL_SEARCH_INDEX = null;
  function buildGlobalSearchIndex() {
    if (GLOBAL_SEARCH_INDEX) return GLOBAL_SEARCH_INDEX;
    const idx = [];
    MODULES.forEach(mod => {
      (mod.narrative || []).forEach(sec => {
        idx.push({
          type: "section", moduleId: mod.id, moduleName: mod.name, heading: sec.heading,
          text: [sec.heading, stripTags(sec.intro || ""), ...(sec.definitions||[]).flatMap(d=>[d.term,d.definition]), ...(sec.procedures||[]).flatMap(p=>[p.title, ...(p.steps||[]).map(stripTags)])].join(" ")
        });
        (sec.definitions || []).forEach(d => {
          idx.push({ type: "definition", moduleId: mod.id, moduleName: mod.name, heading: sec.heading, term: d.term, text: d.term + " " + stripTags(d.definition) });
        });
        (sec.procedures || []).forEach(p => {
          idx.push({ type: "procedure", moduleId: mod.id, moduleName: mod.name, heading: sec.heading, term: p.title, text: p.title + " " + (p.steps||[]).map(stripTags).join(" ") });
        });
      });
      (mod.qaItems || []).forEach(it => {
        idx.push({ type: "qa", moduleId: mod.id, moduleName: mod.name, heading: it.section || "General", term: it.question, text: it.question + " " + stripTags(it.answer) + " " + (it.tags||[]).join(" ") });
      });
    });
    GLOBAL_SEARCH_INDEX = idx;
    return idx;
  }
  function stripTags(html) { return String(html).replace(/<[^>]+>/g, " "); }

  function searchGlobal(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    const terms = q.split(/\s+/).filter(Boolean);
    const idx = buildGlobalSearchIndex();
    return idx
      .map(entry => {
        const hay = entry.text.toLowerCase();
        let score = 0;
        terms.forEach(t => {
          if ((entry.term || entry.heading || "").toLowerCase().includes(t)) score += 5;
          if (hay.includes(t)) score += 1;
        });
        return { entry, score };
      })
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 40)
      .map(x => x.entry);
  }

  function renderSearchResults(query) {
    const results = searchGlobal(query);
    main.innerHTML = `
      <div class="browse-shell">
        <div class="doc-header">
          <span class="doc-eyebrow" style="background:var(--accent-tint);color:var(--accent)">Search</span>
          <h1 class="doc-title">"${escapeHtml(query)}"</h1>
          <p class="doc-tagline">${results.length} result${results.length===1?'':'s'} across all documentation</p>
        </div>
        ${results.length ? `<div class="search-results-list">${results.map(r => `
          <button class="search-result-item" data-module="${r.moduleId}" data-heading="${escapeHtml(r.heading)}">
            <span class="search-result-module" style="background:${tint(r.moduleId)};color:${fg(r.moduleId)}">${escapeHtml(r.moduleName)}</span>
            <span class="search-result-heading">${escapeHtml(r.heading)}</span>
            <span class="search-result-term">${escapeHtml(r.term || r.heading)}</span>
          </button>
        `).join("")}</div>` : `<p style="color:var(--muted)">No documentation matches "${escapeHtml(query)}". Try the chat to ask a full question instead.</p>`}
      </div>
    `;
    main.querySelectorAll(".search-result-item").forEach(btn => {
      btn.addEventListener("click", () => {
        state = { view: "browse", moduleId: btn.dataset.module };
        renderRail();
        renderBrowse(state.moduleId);
        requestAnimationFrame(() => {
          const target = document.getElementById(`sec-${slugify(btn.dataset.heading)}`);
          if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
    });
  }

  // ---------- Speech recognition ----------
  function initRecognizer() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.continuous = false;
    r.interimResults = false;
    r.lang = "en-US";
    return r;
  }

  // ---------- Chat view ----------
  function chatMsgHtml(msg, idx) {
    const isUser = msg.role === "user";
    let body = renderAnswerHtml(msg.content);
    if (msg.sourceModule) {
      body += `<span class="chat-source-tag" style="background:${tint(msg.sourceModule)};color:${fg(msg.sourceModule)}">${msg.sourceModuleName}</span>`;
      if (msg.aiSynthesized) {
        body += `<span class="chat-source-tag ai-tag">AI-phrased</span>`;
      }
    }
    if (msg.clarifyOptions && msg.clarifyOptions.length) {
      body += `<div class="chat-clarify">` + msg.clarifyOptions.map((o, i) =>
        `<button class="chat-clarify-btn" data-idx="${idx}" data-opt="${i}">${escapeHtml(o.question)}</button>`
      ).join("") + `</div>`;
    }
    if (msg.followups && msg.followups.length) {
      body += `<div class="chat-followups"><span class="chat-followups-label">Related</span>` +
        msg.followups.map(q => `<button class="chat-followup-btn" data-q="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join("") +
        `</div>`;
    }
    return `
      <div class="chat-msg ${isUser ? 'user' : 'assistant'}">
        <div class="chat-avatar ${isUser ? 'user' : 'assistant'}">${isUser ? 'Y' : 'AR'}</div>
        <div class="chat-bubble">${body}</div>
      </div>`;
  }

  function renderChat() {
    // Each render creates fresh DOM, so drop any status listener bound to the
    // previous render's (now-detached) badge element before adding a new one.
    aiStatusListeners = [];
    main.innerHTML = `
      <div class="chat-shell">
        ${chatHistory.length === 0 ? `
        <div class="chat-hero">
          <span class="chat-hero-badge"><span class="status-dot" style="width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block"></span>Arena Support AI</span>
          <h1>How can I help?</h1>
          <p>Ask how to do something in Arena — creating records, assigning users, running approvals — and I'll point you to the exact screen and steps. Type, or tap the mic to speak.</p>
        </div>
        <div class="chat-welcome" id="chat-welcome">
          <p class="chat-welcome-lead">This assistant answers "how do I…" questions about Inncircles Arena, using Arena's own documentation — nothing else.</p>
          <ul class="chat-welcome-list">
            <li>Ask in plain language, e.g. <em>"How do I create a project?"</em></li>
            <li>Name the module if you know it — Time Management, Procurement, and so on.</li>
            <li>Ask one thing at a time, then follow up with the next question.</li>
            <li>Type your question, or tap the mic to speak it.</li>
          </ul>
          <p class="chat-welcome-note">It only knows what's documented — if it can't answer, it'll point you to <a href="mailto:support@inncircles.com">support@inncircles.com</a>.</p>
          <p class="chat-welcome-first-visit" id="chat-welcome-first-visit">On first visit the AI model downloads once (a few hundred MB) and is cached after that. It works best in the latest Chrome or Edge on a desktop or laptop.</p>
        </div>` : `<div class="chat-history-bar"><button id="clear-history-btn" class="clear-history-btn">Clear conversation</button></div>`}
        <div class="ai-mode-row">
          <span id="ai-status-badge" class="ai-mode-toggle" aria-live="polite">
            <span class="dot"></span><span id="ai-status-label">Starting up…</span>
          </span>
        </div>
        <div class="ai-gate" id="ai-gate">
          <div class="ai-gate-progress-row">
            <div class="ai-gate-progress-track"><div class="ai-gate-progress-fill" id="ai-gate-progress-fill"></div></div>
            <span class="ai-gate-progress-pct" id="ai-gate-progress-pct">0%</span>
          </div>
          <p class="ai-gate-text" id="ai-gate-text">Loading AI model…</p>
          <p class="ai-gate-fallback" id="ai-gate-fallback" hidden></p>
          <button class="ai-gate-continue-btn" id="ai-gate-continue-btn" hidden>Continue with basic answers</button>
        </div>
        <div class="chat-log" id="chat-log"></div>
        <div id="chat-suggest-wrap"></div>
        <div class="chat-input-bar">
          <input id="chat-input" type="text" placeholder="e.g. How do I assign a user to a project?" autocomplete="off">
          <button class="mic-btn" id="mic-btn" title="Ask by voice" aria-label="Ask by voice">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button class="send-btn" id="chat-send">Send</button>
        </div>
        <div class="chat-status-note" id="chat-status-note"></div>
      </div>
    `;

    const log = document.getElementById("chat-log");
    const suggestWrap = document.getElementById("chat-suggest-wrap");
    const input = document.getElementById("chat-input");
    const sendBtn = document.getElementById("chat-send");
    const micBtn = document.getElementById("mic-btn");
    const statusNote = document.getElementById("chat-status-note");
    const clearBtn = document.getElementById("clear-history-btn");
    const aiStatusBadge = document.getElementById("ai-status-badge");
    const aiStatusLabel = document.getElementById("ai-status-label");
    const gate = document.getElementById("ai-gate");
    const gateProgressFill = document.getElementById("ai-gate-progress-fill");
    const gateProgressPct = document.getElementById("ai-gate-progress-pct");
    const gateText = document.getElementById("ai-gate-text");
    const gateFallback = document.getElementById("ai-gate-fallback");
    const gateContinueBtn = document.getElementById("ai-gate-continue-btn");
    const chatWelcome = document.getElementById("chat-welcome");

    // Only an explicit "Continue with basic answers" choice unlocks the chat
    // before the AI is ready. Returning visitors wait for the model too; it's
    // cached after the first visit, so that wait is short.
    if (getBasicModeChosen()) {
      chatUnlocked = true;
    }

    function setLocked(locked) {
      input.disabled = locked;
      sendBtn.disabled = locked;
      micBtn.disabled = locked || !(window.SpeechRecognition || window.webkitSpeechRecognition);
      input.placeholder = locked ? "Getting the AI ready…" : "e.g. How do I assign a user to a project?";
      suggestWrap.classList.toggle("chat-suggest-hidden", locked);
    }

    // Paints the gate panel (progress bar / fallback message / continue button)
    // and flips the locked state of the input row + suggestion chips. This is
    // the single source of truth for "can the visitor chat yet?".
    function paintGate() {
      if (!gate) return; // view was swapped away before this fired
      const ready = ArenaLLM.isReady();
      const loading = ArenaLLM.isLoading();
      const supported = ArenaLLM.isSupported();

      if (ready || chatUnlocked) {
        // Ready unlocks everyone immediately; chatUnlocked (basic mode chosen)
        // never re-locks even pre-ready.
        gate.hidden = true;
        setLocked(false);
        if (ready) {
          gateText.textContent = "";
        }
        return;
      }

      gate.hidden = false;

      if (loading || (supported && !ArenaLLM.failReason())) {
        // Actively downloading/initializing.
        setLocked(true);
        gateFallback.hidden = true;
        gateContinueBtn.hidden = true;
        const pct = Math.max(0, Math.min(1, aiLoadProgress.progress || 0));
        const pctInt = Math.round(pct * 100);
        gateProgressFill.style.width = pctInt + "%";
        gateProgressPct.textContent = pctInt + "%";
        gateText.textContent = "Loading AI model… " + pctInt + "%" + (aiLoadProgress.text ? " — " + aiLoadProgress.text : "");
      } else {
        // Not supported, or load failed outright — never leave the visitor
        // stuck: explain why in plain language and offer the basic fallback.
        setLocked(true);
        gateProgressFill.style.width = "0%";
        gateProgressPct.textContent = "";
        gateText.textContent = "";
        gateFallback.hidden = false;
        gateFallback.textContent = ArenaLLM.failReason() ||
          "The AI needs WebGPU in a recent Chrome or Edge on desktop, and this page must be opened directly (not embedded inside another site).";
        gateContinueBtn.hidden = false;
      }
    }

    if (gateContinueBtn) {
      gateContinueBtn.addEventListener("click", () => {
        setBasicModeChosen();
        chatUnlocked = true;
        paintGate();
        input.focus();
      });
    }

    let wasReadyPainted = ArenaLLM.isReady();
    function paintAiStatus() {
      if (!aiStatusBadge) return; // view was swapped away before this fired
      const loading = ArenaLLM.isLoading();
      const ready = ArenaLLM.isReady();
      aiStatusBadge.classList.toggle("loading", loading);
      aiStatusBadge.classList.toggle("ready", ready);
      if (ready) {
        aiStatusLabel.textContent = "AI ready — ask your first question";
      } else if (loading) {
        aiStatusLabel.textContent = "Loading AI model (first visit only)…";
      } else if (!ArenaLLM.isSupported()) {
        aiStatusLabel.textContent = "Offline mode (AI unavailable in this browser)";
      } else {
        aiStatusLabel.textContent = "Starting up…";
      }
      paintGate();
      // Focus the input the moment the model transitions into "ready" — but
      // only that once, so we don't keep yanking focus back on later status
      // pings while the visitor is already typing or reading.
      if (ready && !wasReadyPainted) {
        input.focus();
      }
      wasReadyPainted = ready;
    }
    paintAiStatus();
    aiStatusListeners.push(paintAiStatus);
    paintGate();

    function paintLog() {
      log.innerHTML = chatHistory.map((m, i) => chatMsgHtml(m, i)).join("");
      wireInteractiveBubbles();
      log.scrollTop = log.scrollHeight;
    }

    function wireInteractiveBubbles() {
      log.querySelectorAll(".chat-followup-btn").forEach(btn => {
        btn.addEventListener("click", () => { input.value = btn.dataset.q; sendQuestion(); });
      });
      log.querySelectorAll(".chat-clarify-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const msgIdx = Number(btn.dataset.idx);
          const optIdx = Number(btn.dataset.opt);
          const chosen = chatHistory[msgIdx].clarifyOptions[optIdx];
          answerDirectly(chosen);
        });
      });
    }

    function paintSuggestions() {
      if (chatHistory.length > 0) { suggestWrap.innerHTML = ""; return; }
      suggestWrap.innerHTML = `<div class="chat-suggest-row">${SUGGESTED_QUESTIONS.map(q => `<button class="chat-suggest" data-q="${escapeHtml(q)}">${q}</button>`).join("")}</div>`;
      suggestWrap.querySelectorAll(".chat-suggest").forEach(btn => {
        btn.addEventListener("click", () => { input.value = btn.dataset.q; sendQuestion(); });
      });
    }

    // Directly render a chosen answer (used when the user picks a clarify option)
    // without pushing a new synthetic user turn.
    function answerDirectly(entry) {
      chatHistory.push({
        role: "assistant",
        content: conversationalize(entry.answer),
        sourceModule: entry.moduleId,
        sourceModuleName: entry.moduleName
      });
      lastMatchedContext = { moduleId: entry.moduleId, object: entry.object };
      saveHistory();
      renderChat();
    }

    const CLARIFY_INTRO = "I found a few things that could match — which one did you mean?";

    // Renders a lightweight "thinking" bubble while WebLLM synthesizes an answer,
    // so a ~1-3s generation doesn't look like a frozen UI.
    function showThinking() {
      const el = document.createElement("div");
      el.className = "chat-msg assistant";
      el.id = "thinking-msg";
      el.innerHTML = `<div class="chat-avatar assistant">AR</div><div class="chat-bubble"><em style="color:var(--muted)">Thinking…</em></div>`;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }
    function hideThinking() {
      const el = document.getElementById("thinking-msg");
      if (el) el.remove();
    }

    // The offline engine (matchQuery/retrieveTopEntries) is always the source
    // of truth for WHAT documentation is relevant — it never gets bypassed.
    // What changes is who turns that into a reply:
    //  - WebLLM ready: read the actual question, and directly answer it from
    //    the retrieved passages — no clarify-button menu, ever, on this path.
    //    A genuinely unanswerable question still gets an honest "I don't have
    //    documented steps for that" from the model, per its system prompt,
    //    rather than a guess — grounding, not the button UI, is what keeps
    //    this honest.
    //  - WebLLM not ready/unsupported: fall back to the offline engine's own
    //    answer/clarify/none behavior, including the clarify menu, since
    //    without real language understanding a menu is safer than guessing.
    async function sendQuestion() {
      const q = input.value.trim();
      if (!q) return;
      input.value = "";
      chatHistory.push({ role: "user", content: q });
      paintLog();

      if (ArenaLLM.isReady()) {
        showThinking();
        // Keep the candidate set small (top 3, not a wide net): the offline
        // engine's own relevance scoring already does the hard work of
        // ranking, and a small model is much more reliable at picking the
        // right ONE fact out of 2-3 well-ranked candidates and rephrasing it
        // than at correctly ignoring several loosely-related ones out of a
        // wider set — with more candidates it tends to just summarize all of
        // them into a run-on list instead of answering the specific question.
        const context = retrieveTopEntries(KB, q, lastMatchedContext, 3);
        const synthesized = context.length ? await ArenaLLM.answer(q, context) : null;
        hideThinking();

        if (synthesized) {
          // The model's own honest "I don't have documented steps" decline
          // (see ArenaLLM.answer's system prompt) shouldn't be tagged with a
          // source module — none of the retrieved candidates actually
          // answered the question, so attributing the decline to whichever
          // one happened to rank first would be misleading.
          const isDecline = /don't have documented steps/i.test(synthesized);
          const primary = context[0];
          chatHistory.push({
            role: "assistant",
            content: synthesized,
            sourceModule: isDecline ? null : primary.moduleId,
            sourceModuleName: isDecline ? null : primary.moduleName,
            aiSynthesized: !isDecline
          });
          lastMatchedContext = isDecline ? null : { moduleId: primary.moduleId, object: primary.object };
          saveHistory();
          paintSuggestions();
          paintLog();
          input.focus();
          return;
        }
        // Retrieval found nothing at all, or generation failed — fall through
        // to the offline engine below rather than leaving the user with
        // nothing (e.g. a truly out-of-scope question the model correctly
        // declined, or a transient WebLLM error).
      }

      const result = matchQuery(KB, q, lastMatchedContext);

      if (result.type === "answer") {
        const msg = {
          role: "assistant",
          content: conversationalize(result.best.answer),
          sourceModule: result.best.moduleId,
          sourceModuleName: result.best.moduleName
        };
        if (result.alternatives && result.alternatives.length) {
          msg.followups = result.alternatives.map(a => a.question);
        }
        chatHistory.push(msg);
        lastMatchedContext = { moduleId: result.best.moduleId, object: result.best.object };
      } else if (result.type === "clarify") {
        chatHistory.push({
          role: "assistant",
          content: CLARIFY_INTRO,
          clarifyOptions: result.options
        });
        lastMatchedContext = null;
      } else {
        // No confident match. If there are weak suggestions, offer them instead of
        // a flat dead-end; otherwise point to support.
        if (result.suggestions && result.suggestions.length) {
          chatHistory.push({
            role: "assistant",
            content: "I'm not fully sure what you mean — did you mean one of these?",
            clarifyOptions: result.suggestions
          });
        } else {
          chatHistory.push({ role: "assistant", content: NOT_FOUND_MESSAGE });
        }
        lastMatchedContext = null;
      }

      saveHistory();
      paintSuggestions();
      paintLog();
      input.focus();
    }

    sendBtn.addEventListener("click", sendQuestion);
    input.addEventListener("keydown", e => { if (e.key === "Enter") sendQuestion(); });
    if (clearBtn) {
      clearBtn.addEventListener("click", () => {
        chatHistory = [];
        lastMatchedContext = null;
        saveHistory();
        renderChat();
      });
    }

    // Mic / speech-to-text.
    // NOTE: when this page is opened inside claude.ai (as a published Artifact), the
    // browser's own permission indicator can show microphone access as "granted" for
    // the outer claude.ai tab while the embedded artifact frame is still denied mic
    // access by the platform's sandbox — that denial can't be worked around from here.
    // Opening this same index.html file directly (e.g. from GitHub Pages, or any plain
    // web host) removes that sandbox and voice input works normally.
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const isEmbeddedArtifact = window.self !== window.top;
    if (!SR) {
      micBtn.disabled = true;
      micBtn.title = "Voice input isn't supported in this browser — try Chrome";
    } else {
      micBtn.addEventListener("click", () => {
        if (listening) {
          recognizer && recognizer.stop();
          return;
        }
        recognizer = initRecognizer();
        if (!recognizer) return;
        listening = true;
        micBtn.classList.add("listening");
        statusNote.textContent = "Listening…";
        recognizer.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          input.value = transcript;
          sendQuestion();
        };
        recognizer.onerror = (e) => {
          if (e.error === "not-allowed") {
            statusNote.textContent = isEmbeddedArtifact
              ? "Mic blocked by this embedded view — open this page directly (outside claude.ai) to use voice input."
              : "Microphone access denied — allow it for this site in your browser's site settings.";
          } else {
            statusNote.textContent = "Couldn't hear that — try again.";
          }
        };
        recognizer.onend = () => {
          listening = false;
          micBtn.classList.remove("listening");
          if (statusNote.textContent === "Listening…") statusNote.textContent = "";
        };
        try { recognizer.start(); } catch (e) { listening = false; micBtn.classList.remove("listening"); }
      });
    }

    paintLog();
    paintSuggestions();
    if (!input.disabled) input.focus();
  }

  // initial render
  renderRail();
  renderChat();
</script>
